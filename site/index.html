<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule analysis</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 1rem auto; padding: 0 1rem; }
    h1 { font-size: 1.25rem; }
    fieldset { border: 1px solid #ccc; padding: 0.75rem; margin-bottom: 1rem; }
    legend { font-weight: 600; }
    label { display: block; margin-top: 0.5rem; }
    label:first-of-type { margin-top: 0; }
    .row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; }
    .row label { margin-top: 0; }
    .cell { margin-right: 1rem; }
    input[type="range"] { vertical-align: middle; width: 120px; }
    .range-value { display: inline-block; min-width: 3ch; margin-left: 0.25rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 0.5rem; }
    th, td { border: 1px solid #ccc; padding: 0.35rem 0.5rem; text-align: left; }
    th { background: #f5f5f5; }
    #message { margin-top: 0.5rem; color: #666; }
    #message.error { color: #c00; }
  </style>
</head>
<body>
  <h1>Schedule analysis</h1>
  <p>Recommend optimal timeslots for sailing sessions from historical wind data. Session length is in hours (half-hour increments).</p>

  <fieldset>
    <legend>Inputs</legend>
    <div class="row">
      <div class="cell">
        <label for="start">Start date</label>
        <input type="date" id="start" value="2024-06-15">
      </div>
      <div class="cell">
        <label for="end">End date</label>
        <input type="date" id="end" value="2024-07-05">
      </div>
      <div class="cell">
        <label for="hours">Session length (hours)</label>
        <select id="hours">
          <option value="0.5">0.5</option>
          <option value="1">1</option>
          <option value="1.5">1.5</option>
          <option value="2">2</option>
          <option value="2.5">2.5</option>
          <option value="3" selected>3</option>
          <option value="3.5">3.5</option>
          <option value="4">4</option>
          <option value="4.5">4.5</option>
          <option value="5">5</option>
        </select>
      </div>
      <div class="cell">
        <label for="top">Top N</label>
        <input type="number" id="top" min="1" max="48" value="10">
      </div>
    </div>
    <div class="row" style="margin-top: 0.75rem;">
      <div class="cell">
        <label for="windMin">Wind min (kt)</label>
        <input type="range" id="windMin" min="0" max="35" value="5">
        <span class="range-value" id="windMinValue">5</span> kt
      </div>
      <div class="cell">
        <label for="gustMax">Gust max (kt)</label>
        <input type="range" id="gustMax" min="0" max="35" value="15">
        <span class="range-value" id="gustMaxValue">15</span> kt
      </div>
    </div>
    <div class="row" style="margin-top: 0.75rem;">
      <div class="cell">
        <label for="from">Earliest start</label>
        <select id="from">
          <option value="">Any</option>
          <option value="12">6:00 AM</option>
          <option value="13">6:30 AM</option>
          <option value="14">7:00 AM</option>
          <option value="15">7:30 AM</option>
          <option value="16">8:00 AM</option>
          <option value="17">8:30 AM</option>
          <option value="18">9:00 AM</option>
          <option value="19">9:30 AM</option>
          <option value="20">10:00 AM</option>
          <option value="21">10:30 AM</option>
          <option value="22">11:00 AM</option>
          <option value="23">11:30 AM</option>
          <option value="24">12:00 PM</option>
          <option value="25">12:30 PM</option>
          <option value="26">1:00 PM</option>
          <option value="27">1:30 PM</option>
          <option value="28">2:00 PM</option>
          <option value="29">2:30 PM</option>
          <option value="30">3:00 PM</option>
          <option value="31">3:30 PM</option>
          <option value="32">4:00 PM</option>
          <option value="33">4:30 PM</option>
          <option value="34">5:00 PM</option>
          <option value="35">5:30 PM</option>
          <option value="36">6:00 PM</option>
          <option value="37">6:30 PM</option>
          <option value="38">7:00 PM</option>
          <option value="39">7:30 PM</option>
          <option value="40">8:00 PM</option>
          <option value="41">8:30 PM</option>
          <option value="42">9:00 PM</option>
          <option value="43">9:30 PM</option>
          <option value="44">10:00 PM</option>
        </select>
      </div>
      <div class="cell">
        <label for="to">Latest end</label>
        <select id="to">
          <option value="">Any</option>
          <option value="12">6:00 AM</option>
          <option value="13">6:30 AM</option>
          <option value="14">7:00 AM</option>
          <option value="15">7:30 AM</option>
          <option value="16">8:00 AM</option>
          <option value="17">8:30 AM</option>
          <option value="18">9:00 AM</option>
          <option value="19">9:30 AM</option>
          <option value="20">10:00 AM</option>
          <option value="21">10:30 AM</option>
          <option value="22">11:00 AM</option>
          <option value="23">11:30 AM</option>
          <option value="24">12:00 PM</option>
          <option value="25">12:30 PM</option>
          <option value="26">1:00 PM</option>
          <option value="27">1:30 PM</option>
          <option value="28">2:00 PM</option>
          <option value="29">2:30 PM</option>
          <option value="30">3:00 PM</option>
          <option value="31">3:30 PM</option>
          <option value="32">4:00 PM</option>
          <option value="33">4:30 PM</option>
          <option value="34">5:00 PM</option>
          <option value="35">5:30 PM</option>
          <option value="36">6:00 PM</option>
          <option value="37">6:30 PM</option>
          <option value="38">7:00 PM</option>
          <option value="39">7:30 PM</option>
          <option value="40">8:00 PM</option>
          <option value="41">8:30 PM</option>
          <option value="42">9:00 PM</option>
          <option value="43">9:30 PM</option>
          <option value="44">10:00 PM</option>
        </select>
      </div>
    </div>
  </fieldset>

  <div id="summary"></div>
  <div id="message" role="status"></div>
  <table id="results" aria-label="Top timeslots">
    <thead>
      <tr>
        <th>Rank</th>
        <th>Start</th>
        <th>End</th>
        <th>Score</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <p id="footnote" style="font-size: 0.875rem; color: #666; margin-top: 0.5rem;"></p>

  <script src="index.js" type="module"></script>
</body>
</html>
