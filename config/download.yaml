# Download configuration
# CO-OPS limits: 6-min data = 1 month/request, hourly = 1 year/request
# Using 6-min for half-hour granularity in processed stats
# Year-round data (frostbite, school schedules); no sailing_season filter.

defaults:
  # PVDR1 established 2016-09-27; use 2017 for full first year
  start_date: "2017-01-01"
  end_date: null  # null = today
  interval: "6"   # 6 = 6-minute (1 month/request); enables half-hour stats
  units: "english"
  time_zone: "gmt"  # UTC; avoids DST issues, aligns with SunCalc
  delay_seconds: 1.0    # Between API requests (be nice to NOAA)
